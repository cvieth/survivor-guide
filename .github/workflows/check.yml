name: Validate content
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: make check
      - name: Verify site build with temporary PDF target
        run: |
          mkdir -p docs/downloads
          touch docs/downloads/survivor-guide.pdf
          python -m mkdocs build --strict
