name: Publish website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  # Allow the current short deployment to finish; newer pushes replace pending runs.
  group: survivor-guide-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate content
        run: make check
      - name: Build website
        run: make site
      - name: Write build revision
        run: printf '%s\n' "$GITHUB_SHA" > site/revision.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published revision
        shell: bash
        run: |
          url="https://cvieth.github.io/survivor-guide/revision.txt?rev=${GITHUB_SHA}"
          for attempt in {1..15}; do
            published="$(curl --silent --show-error --fail --max-time 8 --header 'Cache-Control: no-cache' "$url" || true)"
            if [[ "$published" == "$GITHUB_SHA" ]]; then
              echo "Live revision verified: $GITHUB_SHA"
              echo "Review: https://cvieth.github.io/survivor-guide/"
              exit 0
            fi
            sleep 3
          done
          echo '::error::GitHub Pages does not yet serve this commit'
          exit 1
