name: Publish website and PDF
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate documentation
        run: make check
      - name: Build website independently of PDF
        run: make site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: site
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install PDF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc texlive-xetex texlive-latex-extra texlive-latex-recommended texlive-fonts-recommended texlive-lang-german lmodern fonts-dejavu-core librsvg2-bin
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Mermaid diagram renderer
        run: npm install --no-audit --no-fund
      - name: Build PDF independently of website
        run: make pdf
      - uses: actions/upload-artifact@v4
        with:
          name: survivor-guide-pdf-preview
          path: build/survivor-guide.pdf
