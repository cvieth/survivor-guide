site_name: Survivor Guide
site_description: Das offene Handbuch für Krisenbewältigung, Überleben und Wiederaufbau.
site_author: Survivor Guide Community
site_url: https://cvieth.github.io/survivor-guide/
repo_url: https://github.com/cvieth/survivor-guide
repo_name: cvieth/survivor-guide
site_dir: site
docs_dir: docs
use_directory_urls: true
strict: true
theme:
  name: material
  language: de
  font: false
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - search.suggest
  palette:
    scheme: slate
    primary: custom
    accent: custom
  icon:
    repo: fontawesome/brands/github
plugins:
  - search:
      lang: de
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
hooks:
  - scripts/mkdocs_hooks.py
extra_css:
  - assets/stylesheets/extra.css
copyright: 'Inhalte unter CC BY-SA 4.0 · Quellcode unter MIT'
nav:
  - Einführung: index.md
  - 'Grundlagen & Soforthilfe':
      - Überblick: 00-grundlagen/index.md
      - Die ersten 72 Stunden: 00-grundlagen/erste-72-stunden.md
      - Evakuierung und Notgepäck: 00-grundlagen/evakuierung-notgepaeck.md
  - 'Wasser, Nahrung & Versorgung':
      - Überblick: 01-versorgung/index.md
      - Wasserbedarf pro Person und Tag: 01-versorgung/wasserbedarf-pro-person.md
      - Notverpflegung für unterwegs auswählen: 01-versorgung/notverpflegung-fuer-unterwegs.md
      - Regenwasser, Pfützen und improvisierte Filter: 01-versorgung/regenwasser-pfuetzen-improvisierte-filter.md
      - Wasser destillieren: 01-versorgung/wasser-destillieren.md
      - Oberflächenwasser aufbereiten: 01-versorgung/oberflaechenwasser-aufbereiten.md
      - Handhygiene ohne Wasserhahn: 01-versorgung/handhygiene-ohne-leitungswasser.md
      - Reinigung und Desinfektion im Notfall: 01-versorgung/reinigung-desinfektion-im-notfall.md
  - 'Medizin & Gesundheit':
      - Überblick: 02-medizin/index.md
      - Medizinischer Notfall: 02-medizin/akuter-medizinischer-notfall.md
      - Bewusstlosigkeit und Wiederbelebung: 02-medizin/bewusstlosigkeit-wiederbelebung.md
      - Starke Blutungen stoppen: 02-medizin/starke-blutungen.md
      - Schock und Kreislaufversagen: 02-medizin/schock-kreislaufversagen.md
      - Knochenbrüche und Verletzungen: 02-medizin/brueche-schwere-verletzungen.md
      - Verbrennungen und Temperaturnotfälle: 02-medizin/verbrennungen-temperaturnotfaelle.md
      - Wundversorgung über mehrere Tage: 02-medizin/wunden-mehrtaegige-versorgung.md
      - Fieber erkennen und versorgen: 02-medizin/fieber-erkennen-und-versorgen.md
      - Beschwerden und Mittel finden: 02-medizin/beschwerden-und-mittel.md
      - Durchfall und Austrocknung: 02-medizin/durchfall-austrocknung.md
  - 'Pharmazie, Substanzen & Chemie':
      - Überblick: 03-pharmazie/index.md
      - Apotheke bei Versorgungsausfall – Prioritäten: 03-pharmazie/apotheke-prioritaeten.md
  - 'Kommunikation & Information':
      - Überblick: 04-kommunikation/index.md
      - Sirenensignale verstehen: 04-kommunikation/sirenensignale.md
      - Funk-Zeitfenster und 3-3-3-Regel: 04-kommunikation/funkzeitfenster-333-regel.md
      - Uhrzeit über Rundfunk-Zeitzeichen: 04-kommunikation/zeitzeichen-rundfunk.md
      - Uhrzeit am Sonnenstand bestimmen: 04-kommunikation/zeitbestimmung-sonne.md
      - Morsealphabet: 04-kommunikation/morsealphabet.md
      - Flaggensemaphore / Winkeralphabet: 04-kommunikation/flaggenalphabet.md
  - 'Technologie, Elektronik & IT':
      - Überblick: 05-technologie/index.md
      - DCF77-Zeitsignal empfangen und dekodieren: 05-technologie/dcf77-zeitfunk.md
      - Funkempfang ohne Radio improvisieren: 05-technologie/radio-ohne-geraet.md
  - 'Energie, Unterkunft & Infrastruktur':
      - Überblick: 06-infrastruktur/index.md
      - Sanitärversorgung bei Ausfall: 06-infrastruktur/sanitaerversorgung-bei-ausfall.md
      - Nottoilette aus Eimern: 06-infrastruktur/nottoilette-eimer.md
      - Abwasserrückstau: 06-infrastruktur/abwasser-rueckstau.md
  - 'Handwerk, Mechanik & Produktion': 07-handwerk/index.md
  - 'Sicherheit, Orientierung & Selbstschutz': 08-sicherheit/index.md
  - 'Gesellschaft, Psychologie & Soziales':
      - Überblick: 09-gesellschaft/index.md
      - Selbstschutz, Solidarität und Grenzen der Hilfe: 09-gesellschaft/grenzen-der-hilfe.md
  - 'Ökologie, Natur & Umwelt': 10-oekologie/index.md
  - 'Wissenserhalt & Wiederaufbau': 11-wiederaufbau/index.md
  - 'Nachschlagewerke & Anhänge':
      - Überblick: 12-nachschlagewerk/index.md
      - Wirkstoffregister: 12-nachschlagewerk/wirkstoffregister.md
      - Heilpflanzenregister: 12-nachschlagewerk/heilpflanzenregister.md
      - Hygiene- und Reinigungsmittelregister: 12-nachschlagewerk/hygienemittel-register.md
      - "Bildquellen: Heilpflanzen": 12-nachschlagewerk/bildquellen-heilpflanzen.md
  - Mitarbeit:
      - Mitmachen: redaktion/mitmachen.md
      - Quellen und Qualität: redaktion/qualitaet.md
