<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 632" width="1120" height="632" role="img" aria-labelledby="title desc"><title id="title">DCF77 Sekundenmarken und Zeitcode</title><desc id="desc">Eine niedrige Trägeramplitude für 100 Millisekunden bedeutet Bit null, für 200 Millisekunden Bit eins, in Sekunde 59 fehlt normalerweise die Absenkung. Unten sind die Positionen der DCF77-Zeitbits als Abschnitte dargestellt.</desc><rect width="1120" height="632" fill="#fff"/><style>text{font-family:"DejaVu Sans",Arial,sans-serif;fill:#1e344e} .header{font-size:32px;font-weight:700} .sub{font-size:23px;font-weight:700} .note{font-size:17px} .hour{font-size:19px;font-weight:700}</style><text x="560" y="52" text-anchor="middle" class="header">DCF77 · Zeitinformation aus Impulslängen</text><text x="45" y="102" class="sub">Trägeramplitude nach der Demodulation (schematisch)</text><text x="50" y="158" class="hour">Bit 0</text><line x1="258" y1="176" x2="1048" y2="176" stroke="#d8e0ec" stroke-width="2"/><path d="M258 124 V186 H330 V124 H978" fill="none" stroke="#2673aa" stroke-width="6" stroke-linejoin="round"/><text x="985" y="134" class="note">1 s</text><text x="294" y="214" text-anchor="middle" class="note">100 ms</text><text x="50" y="268" class="hour">Bit 1</text><line x1="258" y1="286" x2="1048" y2="286" stroke="#d8e0ec" stroke-width="2"/><path d="M258 234 V296 H402 V234 H978" fill="none" stroke="#2673aa" stroke-width="6" stroke-linejoin="round"/><text x="985" y="244" class="note">1 s</text><text x="330" y="324" text-anchor="middle" class="note">200 ms</text><text x="50" y="378" class="hour">Sek. 59</text><line x1="258" y1="396" x2="1048" y2="396" stroke="#d8e0ec" stroke-width="2"/><path d="M258 344 H978" fill="none" stroke="#6299a6" stroke-width="6" stroke-linejoin="round"/><text x="985" y="354" class="note">1 s</text><text x="45" y="492" class="sub">Telegramm → Zeitpunkt der folgenden Minute</text><rect x="45.0" y="516" width="343.3" height="58" fill="#edf0f7" stroke="#7287a0"/><text x="216.7" y="541" text-anchor="middle" class="note">0–19</text><text x="216.7" y="565" text-anchor="middle" class="note">Status / Zone</text><rect x="388.3" y="516" width="17.2" height="58" fill="#ffdea1" stroke="#7287a0"/><rect x="405.5" y="516" width="120.2" height="58" fill="#bde8e4" stroke="#7287a0"/><text x="465.6" y="541" text-anchor="middle" class="note">21–27</text><text x="465.6" y="565" text-anchor="middle" class="note">Minute</text><rect x="525.7" y="516" width="17.2" height="58" fill="#ffdea1" stroke="#7287a0"/><rect x="542.8" y="516" width="103.0" height="58" fill="#b6d8f7" stroke="#7287a0"/><text x="594.3" y="541" text-anchor="middle" class="note">29–34</text><text x="594.3" y="565" text-anchor="middle" class="note">Stunde</text><rect x="645.8" y="516" width="17.2" height="58" fill="#ffdea1" stroke="#7287a0"/><rect x="663.0" y="516" width="377.7" height="58" fill="#d8c9f4" stroke="#7287a0"/><text x="851.8" y="541" text-anchor="middle" class="note">36–57</text><text x="851.8" y="565" text-anchor="middle" class="note">Datum</text><rect x="1040.7" y="516" width="17.2" height="58" fill="#ffdea1" stroke="#7287a0"/><rect x="1057.8" y="516" width="17.2" height="58" fill="#e7e8ea" stroke="#7287a0"/><text x="560" y="608" text-anchor="middle" class="note">100 ms = 0 · 200 ms = 1 · keine Markierung an Sek. 59 (normal) · P = gerade Parität</text></svg>