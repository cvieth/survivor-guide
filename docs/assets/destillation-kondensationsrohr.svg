<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 590" role="img" aria-labelledby="title desc">
<title id="title">Rohrdestillation: Kochtopf, abfallendes Kondensationsrohr, Kühlbad und Auffanggefäß</title>
<desc id="desc">Technische Schnittskizze mit sechs nummerierten Bauteilen. Links ein Topf mit Rohwasser und Dampfentnahme, mittig ein nach rechts abfallendes Metallrohr in einer Kühlwanne, rechts ein sauberes Auffanggefäß. Pfeile zeigen Dampftransport, Wärmeabgabe und Kondensat. Der Rohrausgang ist offen.</desc>
<defs><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10L10 0" stroke="#a8b3bb" stroke-width="1"/></pattern><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#45515c"/></marker><marker id="bluearrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1f779f"/></marker><style>.wall{fill:#f7f9fa;stroke:#26323c;stroke-width:6;stroke-linejoin:round}.thin{fill:none;stroke:#4d5a65;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.lead{fill:none;stroke:#56626c;stroke-width:2;stroke-dasharray:6 5}.num{font:bold 19px sans-serif;text-anchor:middle;dominant-baseline:central;fill:#26323c}.steam{fill:none;stroke:#647786;stroke-width:3;stroke-dasharray:8 7;marker-end:url(#arrow)}</style></defs>
