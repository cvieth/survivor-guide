<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="t d"><title id="t">Topf-in-Topf-Destillation</title><desc id="d">Schnittskizze: Im großen Topf verdampft Rohwasser. Ein umgedrehter kühler Deckel leitet Kondensattropfen in eine erhöht stehende Schale. Zwischen Deckel und Topf bleibt ein offener Spalt für Druckausgleich.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#222"/></marker></defs><g fill="none" stroke="#222" stroke-width="3" stroke-linejoin="round"><path d="M150 120V305Q150 323 168 323H528Q546 323 546 305V120"/><path d="M137 120H559"/><path d="M172 125Q348 225 525 125" stroke-width="5"/><path d="M195 250H502V317H195Z" fill="#cce8f4"/><path d="M306 244V283H389V244"/><path d="M306 244H389"/><path d="M327 283V306H368V283"/><path d="M296 283H400"/><path d="M294 171L294 210M348 178V222M404 171V210" stroke="#666" stroke-dasharray="7 6" marker-end="url(#a)"/><path d="M319 202L319 239M377 202L377 239" stroke="#1678a2" stroke-dasharray="5 5" marker-end="url(#a)"/><path d="M245 96H447" stroke="#1678a2" stroke-width="7"/><path d="M240 96L258 72L276 96M310 96L328 72L346 96M380 96L398 72L416 96"/><path d="M287 338Q307 354 327 338T367 338T407 338" stroke="#c55a11"/></g></svg>