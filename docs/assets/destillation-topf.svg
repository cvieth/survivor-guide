<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc">
<title id="title">Technischer Querschnitt: Wasser im Kochtopf destillieren</title>
<desc id="desc">Schnitt durch einen Kochtopf mit flachem Rohwasserstand, erhöhtem Auffanggefäß und umgedrehtem, gekühltem Metalldeckel. Pfeile zeigen Dampf und Kondensattropfen. Nummerierte Bauteile mit Legende im Markdown.</desc>
<defs>
<pattern id="steel" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#9ca3af" stroke-width="1"/></pattern>
<pattern id="water" width="22" height="14" patternUnits="userSpaceOnUse"><path d="M0 7Q5 2 11 7T22 7" fill="none" stroke="#247ba0" stroke-width="1.5"/></pattern>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#444"/></marker>
<marker id="steamArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#697786"/></marker>
<style>.line{fill:none;stroke:#252d36;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#525f6b;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.leader{fill:none;stroke:#59636e;stroke-width:2.2;stroke-dasharray:6 5}.num{font:700 22px sans-serif;fill:#151d27;text-anchor:middle;dominant-baseline:central}.steam{fill:none;stroke:#697786;stroke-width:3;stroke-dasharray:9 8;marker-end:url(#steamArrow)}.drop{fill:#287eae;stroke:#1d5f80;stroke-width:1.5}</style>
</defs>
