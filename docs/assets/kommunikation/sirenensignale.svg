<title id="title">Sirenensignale: Warnung, Entwarnung, Feuerwehralarm und Probealarm NRW</title>
<desc id="desc">Schematische Darstellung: Eine Minute auf- und abschwellender Heulton warnt vor Gefahr. Ein gleichbleibender Ton von einer Minute bedeutet Entwarnung. Feuerwehralarm ist ein zweimal unterbrochener Dauerton. Der NRW-Probealarm besteht aus Entwarnung, Warnung und Entwarnung.</desc>
