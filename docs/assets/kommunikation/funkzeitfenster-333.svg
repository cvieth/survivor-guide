<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 785" width="1120" height="785" role="img" aria-labelledby="title desc">
<title id="title">3-3-3-Regel: Funk-Zeitfenster auf einer 24-Stunden-Uhr</title>
<desc id="desc">Alle drei Stunden für drei Minuten auf Kanal drei: null, drei, sechs, neun, zwölf, fünfzehn, achtzehn und einundzwanzig Uhr, jeweils bis Minute drei. Die farbigen Markierungen sind schematisch und nicht maßstabsgerecht.</desc>
